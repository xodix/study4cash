openapi: 3.0.3
info:
  title: User API
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /user/register:
    post:
      summary: Register a new user
      operationId: registerUser
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: john.doe@example.com
              password: securePass1
              name: John
              surname: Doe
              birthdate: "1990-06-15T00:00:00Z"
      responses:
        "200":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user_id: 42
        "400":
          description: Validation error — malformed or missing fields
          content:
            application/json:
              schema:
                type: string
              examples:
                invalid_email:
                  summary: Invalid email format
                  value:
                    error: "invalid email format"
                Parsing error:
                  summary: Invalid date
                  value:
                    error: 'code=400, message=Bad Request, err=parsing time "190Z" as "2006-01-02T15:04:05Z07:00": cannot parse "190Z" as "2006"'
                Validation error:
                  summary: Name below minimum length
                  value:
                    error: "Key: 'RegisterRequest.Email' Error:Field validation for 'Email' failed on the 'email' tag\nKey: 'RegisterRequest.Password' Error:Field validation for 'Password' failed on the 'required' tag\nKey: 'RegisterRequest.Name' Error:Field validation for 'Name' failed on the 'min' tag\nKey: 'RegisterRequest.Surname' Error:Field validation for 'Surname' failed on the 'required' tag"

  /user/login:
    post:
      summary: Login the user
      operationId: loginUser
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: john.doe@example.com
              password: securePass1
      responses:
        "200":
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user_id: 42
        "400":
          description: Validation error — malformed or missing fields
          content:
            application/json:
              schema:
                type: string
              examples:
                user_not_found:
                  summary: User does not exist
                  value:
                    error: "User not found"
                Validation error:
                  summary: Name below minimum length
                  value:
                    error: "Key: 'RegisterRequest.Email' Error:Field validation for 'Email' failed on the 'email' tag\nKey: 'RegisterRequest.Password' Error:Field validation for 'Password' failed on the 'required' tag\nKey: 'RegisterRequest.Name' Error:Field validation for 'Name' failed on the 'min' tag\nKey: 'RegisterRequest.Surname' Error:Field validation for 'Surname' failed on the 'required' tag"

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - name
        - surname
        - birthdate
      properties:
        email:
          type: string
          format: email
          description: Valid email address
          example: john.doe@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 32
          description: Password between 8 and 32 characters
          example: securePass1
        name:
          type: string
          minLength: 3
          maxLength: 60
          description: User's first name
          example: John
        surname:
          type: string
          minLength: 3
          maxLength: 60
          description: User's last name
          example: Doe
        birthdate:
          type: string
          format: date-time
          description: Date of birth in RFC 3339 / ISO 8601 format
          example: "1990-06-15T00:00:00Z"

    RegisterResponse:
      type: object
      properties:
        token:
          type: string
          description: Signed JWT for authenticating subsequent requests
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user_id:
          type: integer
          format: uint
          description: Unique ID of the newly created user
          example: 42

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Valid email address
          example: john.doe@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 32
          description: Password between 8 and 32 characters
          example: securePass1

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Signed JWT for authenticating subsequent requests
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user_id:
          type: integer
          format: uint
          description: Unique ID of the newly created user
          example: 42

    DetailsResponse:
      type: object
      properties:
        id:
          type: integer
          format: uint
          description: Unique ID of the user
          example: 42
        email:
          type: string
          description: Users email
          example: john.doe@example.com
        name:
          type: string
          description: Users first name
          example: John
        surname:
          type: string
          description: Users last name
          example: Doe
        birthdate:
          type: string
          format: date-time
          description: Users birthdate as a timestamp
