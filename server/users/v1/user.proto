syntax = "proto3";

package users.v1;

import "buf/validate/validate.proto";
import "google/type/date.proto";

message LoginRequest {
	string email = 1 [(buf.validate.field).string.email = true];
	string password = 2 [(buf.validate.field).string.min_len = 8, (buf.validate.field).string.max_len = 32];
}

message LoginError {
	string error = 1;
}

message LoginResponse {
  string token = 1;
  uint64 user_id = 2;
}

message User {
	string email = 1 [(buf.validate.field).string.email = true];
	string password = 2 [(buf.validate.field).string.min_len = 8, (buf.validate.field).string.max_len = 32];
	string name = 3 [(buf.validate.field).string.min_len = 3, (buf.validate.field).string.max_len = 60];
	string surname = 4 [(buf.validate.field).string.min_len = 3, (buf.validate.field).string.max_len = 60];
	google.type.Date birthdate = 5;
}

message RegisterRequest {
	User user = 1; 
}

message RegisterResponse {
	string token = 1;
	uint64 user_id = 2;
}

message RegisterError {
	string error = 1;
}

service UserService {
	rpc Login(LoginRequest) returns (LoginResponse) {}
	rpc Register(RegisterRequest) returns (RegisterResponse) {}
}
